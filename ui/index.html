<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Outremer — protótipo da engine (offline MMO)</title>
<link rel="stylesheet" href="ui/style.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="orb-hp" class="orb"><i></i><b></b></div><div id="orb-mp" class="orb"><i></i><b></b></div>
<div id="targetbar" style="display:none"><i></i><span></span></div>
<div id="tip"></div><div id="prompt"></div>
<div id="death"><h2>Você morreu</h2><p>Nada se perde: você volta ao templo da vila.</p><button onclick="Combat.revive()">Voltar à vila</button></div>
<div id="create">
  <form autocomplete="off">
    <h1>Outremer</h1>
    <p class="sub">shard offline · protótipo da engine</p>
    <label>Nome</label><input name="nome" maxlength="16" required>
    <div class="row">
      <div><label>Sexo</label><select name="sexo"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
      <div><label>Começo</label><select name="cls"></select></div>
    </div>
    <p class="kitinfo"></p>
    <div class="free row"><div><select></select></div><div><select></select></div><div><select></select></div></div>
    <p class="note">Não há classe fixa: qualquer skill sobe com o uso. O começo só escolhe as primeiras skills e o equipamento.</p>
    <button>Entrar no mundo</button>
    <p class="note">Vila provisória com mapa do Flare (CC-BY-SA). Personagens de A Cruz de Montgisard.</p>
  </form>
</div>
<script src="game.js"></script>
</body>
</html>
